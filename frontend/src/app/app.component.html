<!-- Session Restoration / Auth Check Splash Screen -->
<div *ngIf="authService.isAuthChecking()" class="auth-splash-screen" role="status" aria-live="polite">
  <div class="auth-splash-card">
    <div class="auth-splash-badge">Q</div>
    <div class="claude-dots" aria-hidden="true">
      <span class="claude-dot dot-1"></span>
      <span class="claude-dot dot-2"></span>
      <span class="claude-dot dot-3"></span>
    </div>
    <span class="auth-splash-text">Verifying Quest session...</span>
  </div>
</div>

<router-outlet></router-outlet>
