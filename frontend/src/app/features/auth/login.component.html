<div class="auth-page-container">
  <main class="auth-card" role="main">
    <!-- Brand Header -->
    <header class="auth-brand-header">
      <div class="auth-logo-badge" aria-hidden="true">
        <span class="auth-logo-letter">Q</span>
      </div>
      <h1 class="auth-title">QuestAI</h1>
      <p class="auth-subtitle">
        {{ isForgotMode() ? 'Reset your password to regain access' : 'Sign in with your Quest organization credentials' }}
      </p>
    </header>

    <!-- Error Alert Banner -->
    <div *ngIf="errorMessage() && !isForgotMode()" class="auth-alert error-alert" role="alert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div class="alert-content">
        <span>{{ errorMessage() }}</span>
      </div>
    </div>

    <!-- Login Form View -->
    <form *ngIf="!isForgotMode()" (ngSubmit)="onLoginSubmit()" class="auth-form" novalidate>
      <!-- Email Field -->
      <div class="form-group">
        <label for="login-email" class="form-label">Email address</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="username"
          required
          placeholder="name@company.com"
          class="form-input"
          [disabled]="isSubmitting()"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="login-password" class="form-label">Password</label>
          <button
            type="button"
            class="link-forgot"
            (click)="switchToForgotMode()"
            [disabled]="isSubmitting()"
          >
            Forgot password?
          </button>
        </div>
        <div class="password-input-wrapper">
          <input
            id="login-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            required
            placeholder="••••••••••••"
            class="form-input password-input"
            [disabled]="isSubmitting()"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <!-- Eye Open Icon -->
            <svg *ngIf="!showPassword()" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Off Icon -->
            <svg *ngIf="showPassword()" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn-auth-submit"
        [disabled]="isSubmitting() || !email().trim() || !password()"
      >
        <span *ngIf="!isSubmitting()">Sign In</span>
        <span *ngIf="isSubmitting()" class="submitting-spinner">
          <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle class="spinner-track" cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
            <path class="spinner-head" d="M12 2a10 10 0 0 1 10 10"></path>
          </svg>
          Signing in...
        </span>
      </button>

      <p class="auth-footer-notice">
        Access is restricted to authorized Quest personnel and registered contractors.
      </p>
    </form>

    <!-- Forgot Password View -->
    <div *ngIf="isForgotMode()" class="forgot-password-panel">
      <!-- Success Message Banner -->
      <div *ngIf="forgotSuccessMessage()" class="auth-alert success-alert" role="status">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="alert-content">
          <span>{{ forgotSuccessMessage() }}</span>
        </div>
      </div>

      <!-- Forgot Error Banner -->
      <div *ngIf="forgotErrorMessage()" class="auth-alert error-alert" role="alert">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div class="alert-content">
          <span>{{ forgotErrorMessage() }}</span>
        </div>
      </div>

      <form (ngSubmit)="onForgotPasswordSubmit()" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">Email address</label>
          <input
            id="forgot-email"
            name="forgotEmail"
            type="email"
            autocomplete="email"
            required
            placeholder="name@company.com"
            class="form-input"
            [disabled]="isSubmittingForgot()"
            [ngModel]="forgotEmail()"
            (ngModelChange)="forgotEmail.set($event)"
          />
        </div>

        <button
          type="submit"
          class="btn-auth-submit"
          [disabled]="isSubmittingForgot() || !forgotEmail().trim()"
        >
          <span *ngIf="!isSubmittingForgot()">Send Reset Link</span>
          <span *ngIf="isSubmittingForgot()" class="submitting-spinner">
            <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle class="spinner-track" cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
              <path class="spinner-head" d="M12 2a10 10 0 0 1 10 10"></path>
            </svg>
            Sending instructions...
          </span>
        </button>

        <button
          type="button"
          class="btn-auth-secondary"
          (click)="switchToLoginMode()"
          [disabled]="isSubmittingForgot()"
        >
          Back to Sign In
        </button>
      </form>
    </div>
  </main>
</div>
