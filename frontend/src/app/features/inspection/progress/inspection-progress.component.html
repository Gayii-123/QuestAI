<div class="inspection-progress-inline" *ngIf="progress" role="status" aria-live="polite">
  <span class="progress-bank-pill">{{ progress.bankName }}</span>
  <span class="progress-dot">·</span>
  <span class="progress-count">{{ progress.assessedCount }} of {{ progress.totalApplicableCount }} assessed</span>
  <ng-container *ngIf="progress.carCount > 0">
    <span class="progress-dot">·</span>
    <span class="progress-car-flag">{{ progress.carCount }} Defect{{ progress.carCount > 1 ? 's' : '' }}</span>
  </ng-container>
  <ng-container *ngIf="progress.isDraftReady">
    <span class="progress-dot">·</span>
    <span class="progress-ready-flag">Draft Ready</span>
  </ng-container>
</div>
