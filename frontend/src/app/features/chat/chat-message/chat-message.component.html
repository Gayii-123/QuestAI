<div class="message-row" [class.user-row]="msg.sender === 'user'" [class.assistant-row]="msg.sender !== 'user'">

  <!-- Assistant Circle Avatar (Left side) -->
  <div class="avatar-assistant" *ngIf="msg.sender !== 'user'" aria-label="QuestAI">
    <span>Q</span>
  </div>

  <!-- USER MESSAGE: Aligned Right in a Bubble (ChatGPT / E-IMS style) -->
  <div *ngIf="msg.sender === 'user'" class="user-bubble-container">
    <div class="user-bubble" [class.has-photos]="msg.photos && msg.photos.length > 0">
      <!-- User Bubble Header: 'You' + Timestamp -->
      <div class="user-bubble-header">
        <span class="user-bubble-sender">You</span>
        <span class="user-bubble-time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>

      <!-- Attached Site Photographs Grid (if any) -->
      <div *ngIf="msg.photos && msg.photos.length > 0" class="user-message-photos-grid"
        aria-label="Attached site photographs">
        <div *ngFor="let photo of msg.photos" class="user-msg-photo-card" [title]="photo.name">
          <!-- Real image thumbnail if URL is available -->
          <img *ngIf="getResolvedPhotoUrl(photo)"
               [src]="getResolvedPhotoUrl(photo)"
               [alt]="photo.name"
               class="user-msg-photo-thumb"
               (error)="onPhotoError(photo)" />

          <!-- Fallback photo badge if binary is stripped or unavailable -->
          <div *ngIf="!getResolvedPhotoUrl(photo)" class="user-msg-photo-fallback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="photo-fallback-icon">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="photo-fallback-name">{{ photo.name }}</span>
            <span class="photo-fallback-size" *ngIf="photo.size">{{ formatFileSize(photo.size) }}</span>
          </div>
        </div>
      </div>

      <!-- Attached Document (if any) -->
      <div *ngIf="msg.attachmentName" class="user-bubble-attachment">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>{{ msg.attachmentName }}</span>
      </div>

      <!-- User Text Content (if any) -->
      <p *ngIf="msg.content" class="user-bubble-text">{{ msg.content }}</p>
    </div>
  </div>

  <!-- User Circle Avatar (Right side) -->
  <div class="avatar-user" *ngIf="msg.sender === 'user'" aria-label="User avatar">
    <img *ngIf="userPhotoUrl()" [src]="userPhotoUrl()" alt="User" class="avatar-user-img" />
    <span *ngIf="!userPhotoUrl()">{{ userInitials() }}</span>
  </div>

  <!-- ASSISTANT MESSAGE: Plain text response (NO BOX / NO BUBBLE) + Reports in Square Box -->
  <div *ngIf="msg.sender !== 'user'" class="assistant-content-container">

    <!-- Error notice if failed -->
    <div *ngIf="msg.isError" class="assistant-error-banner">
      <p class="error-text">{{ msg.content }}</p>
    </div>

    <!-- AI Answer: Pure Text / Markdown Flow (like ChatGPT) -->
    <div *ngIf="!msg.isError && msg.content && !msg.singleQuestion"
      class="assistant-text-content" [innerHTML]="formatStructuredMessage(msg.content)"></div>

    <!-- Subtle ChatGPT-Style Response Action Toolbar (Copy) -->
    <div *ngIf="!msg.isError && msg.content && !msg.singleQuestion" class="assistant-actions-toolbar">
      <button type="button" class="action-btn" (click)="copyResponse(msg.content)" [title]="isCopied ? 'Copied!' : 'Copy response'">
        <svg *ngIf="!isCopied" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg *ngIf="isCopied" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#16a34a" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>

    <!-- Reports, Checklists & Workflows in Square Box (Like ChatGPT Cards) -->
    <div class="assistant-cards-flow">
      <!-- 1. Compact Inspection Progress Badge -->
      <app-inspection-progress *ngIf="msg.inspectionProgress && !msg.singleQuestion"
        [progress]="msg.inspectionProgress"></app-inspection-progress>

      <!-- Single Interactive Clarification Question Card (Square Box Card) -->
      <app-inspection-single-question-card *ngIf="msg.singleQuestion" [question]="msg.singleQuestion"
        [questionNumber]="msg.singleQuestionIndex" [totalQuestions]="msg.singleQuestionTotal"
        (answer)="onSingleQuestionAnswer($event)" (skip)="onSingleQuestionSkip($event)"
        (dismiss)="onSingleQuestionSkip($event)"></app-inspection-single-question-card>

      <!-- 2. Assistant Evidence Observations (Square Box Card) -->
      <app-inspection-evidence-message *ngIf="msg.evidenceMessage" [evidence]="msg.evidenceMessage"></app-inspection-evidence-message>

      <!-- 3. Adaptive Grouped Follow-Up Question Batch (Square Box Card) -->
      <app-inspection-question-batch *ngIf="msg.questionBatch" [batch]="msg.questionBatch"
        (answerQuestion)="onBatchAnswerQuestion($event)" (submitBatch)="onBatchSubmitAll($event)"
        (continueNext)="onBatchContinue()"
        (requestPhoto)="onQuestionRequestPhoto($event)"></app-inspection-question-batch>

      <!-- 4. Final Structured Draft Summary Card (Square Box Card) -->
      <app-inspection-draft-summary *ngIf="msg.draftSummary" [summary]="msg.draftSummary"
        (openReview)="openReviewDrawer(msg.draftSummary)"
        (downloadPdf)="downloadReportPdf(msg.draftSummary)"></app-inspection-draft-summary>

      <!-- Compact Interactive Inspection Category Chips -->
      <div *ngIf="msg.showInspectionCategories && !msg.isError" class="chat-category-chips-wrap" role="group"
        aria-label="Site inspection categories">
        <button *ngFor="let bank of siteInspectionBanks" type="button" class="chat-category-chip"
          [class.selected]="msg.selectedBankId === bank.id"
          (click)="onSelectCategoryChip(bank)">
          {{ bank.name }}
        </button>
        <button type="button" class="chat-category-chip cancel-chip" (click)="cancelCategorySelection()"
          title="Cancel category selection">
          Cancel
        </button>
      </div>

      <!-- Direct Inline Photo Upload Card (Square Box Card) -->
      <div *ngIf="msg.showInlinePhotoUpload && !msg.isError" class="chat-direct-upload-wrap">
        <input #directUploadInput type="file" multiple accept="image/*"
          (change)="onDirectPhotosSelected($event)" style="display: none" />

        <div class="direct-upload-card" (click)="directUploadInput.click()"
          (dragover)="onDirectPhotoDragOver($event)" (drop)="onDirectPhotoDrop($event)">

          <div class="direct-upload-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              class="direct-camera-svg">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
              </path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>

          <div class="direct-upload-text">
            <span class="direct-upload-title">Upload Site Photographs</span>
            <span class="direct-upload-sub">Click here or drag &amp; drop photos from your device</span>
          </div>

          <button type="button" class="btn-direct-choose"
            (click)="$event.stopPropagation(); directUploadInput.click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="choose-icon">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Choose Photos</span>
          </button>
        </div>
      </div>

      <!-- Retry action if message failed -->
      <div *ngIf="msg.isError && msg.retryPrompt" class="message-retry-row">
        <button class="btn-retry-message" (click)="retryMessage(msg.retryPrompt)" type="button"
          [disabled]="chatState.isGenerating()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="retry-icon">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
          Retry Question
        </button>
      </div>
    </div>
  </div>
</div>
