<div class="message-row" [class.user-row]="msg.sender === 'user'" [class.assistant-row]="msg.sender !== 'user'">
  <!-- Assistant Avatar -->
  <div class="message-avatar" *ngIf="msg.sender !== 'user'" aria-hidden="true">
    <div class="avatar-logo-wrap">
      <svg class="avatar-q-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 14 C30.12 14 14 30.12 14 50 C14 69.88 30.12 86 50 86 C58.2 86 65.75 83.25 71.8 78.6 L78.4 85.2 C79.6 86.4 81.5 86.4 82.7 85.2 C83.9 84 83.9 82.1 82.7 80.9 L76.3 74.5 C82.4 67.8 86 59.3 86 50 C86 30.12 69.88 14 50 14 Z M50 74 C36.75 74 26 63.25 26 50 C26 36.75 36.75 26 50 26 C63.25 26 74 36.75 74 50 C74 56.4 71.5 62.2 67.4 66.5 L60.2 59.3 C61.3 56.6 62 53.4 62 50 C62 43.37 56.63 38 50 38 C43.37 38 38 43.37 38 50 C38 56.63 43.37 62 50 62 C52.2 62 54.3 61.4 56.1 60.3 L63.6 67.8 C59.8 71.7 55.1 74 50 74 Z" fill="#e11d48"/>
      </svg>
    </div>
  </div>

  <div class="message-bubble" [class.user-bubble]="msg.sender === 'user'"
    [class.assistant-bubble]="msg.sender !== 'user'" [class.error-bubble]="msg.isError"
    [class.workflow-bubble]="msg.isInspectionWorkflowMessage">
    <div class="bubble-header">
      <div class="bubble-header-left">
        <span class="sender-name">
          {{ msg.sender === 'user' ? 'You' : 'QuestAI' }}
        </span>
      </div>
      <span class="message-time">
        {{ msg.timestamp | date:'shortTime' }}
      </span>
    </div>

    <div class="bubble-body">
      <!-- Attached Photographs Inside User Message Bubble -->
      <div *ngIf="msg.photos && msg.photos.length > 0" class="user-message-photos-grid"
        aria-label="Attached site photographs">
        <div *ngFor="let photo of msg.photos" class="user-msg-photo-card">
          <img [src]="photo.url" [alt]="photo.name" class="user-msg-photo-thumb" />
        </div>
      </div>

      <!-- User or Error Plain Text -->
      <p *ngIf="(msg.sender === 'user' && msg.content) || msg.isError" class="bubble-text"
        [class.error-text]="msg.isError">
        {{ msg.content }}</p>

      <!-- Assistant Structured Response -->
      <div *ngIf="msg.sender !== 'user' && !msg.isError && msg.content && !msg.singleQuestion"
        class="bubble-structured-content" [innerHTML]="formatStructuredMessage(msg.content)"></div>

      <!-- 1. Compact Inspection Progress Badge -->
      <app-inspection-progress *ngIf="msg.inspectionProgress && !msg.singleQuestion"
        [progress]="msg.inspectionProgress"></app-inspection-progress>

      <!-- Single Interactive Clarification Question Card -->
      <app-inspection-single-question-card *ngIf="msg.singleQuestion" [question]="msg.singleQuestion"
        [questionNumber]="msg.singleQuestionIndex" [totalQuestions]="msg.singleQuestionTotal"
        (answer)="onSingleQuestionAnswer($event)" (skip)="onSingleQuestionSkip($event)"
        (dismiss)="onSingleQuestionSkip($event)"></app-inspection-single-question-card>

      <!-- 2. Assistant Evidence Observations -->
      <app-inspection-evidence-message *ngIf="msg.evidenceMessage" [evidence]="msg.evidenceMessage"></app-inspection-evidence-message>

      <!-- 3. Adaptive Grouped Follow-Up Question Batch -->
      <app-inspection-question-batch *ngIf="msg.questionBatch" [batch]="msg.questionBatch"
        (answerQuestion)="onBatchAnswerQuestion($event)" (submitBatch)="onBatchSubmitAll($event)"
        (continueNext)="onBatchContinue()"
        (requestPhoto)="onQuestionRequestPhoto($event)"></app-inspection-question-batch>

      <!-- 4. Final Structured Draft Summary Card -->
      <app-inspection-draft-summary *ngIf="msg.draftSummary" [summary]="msg.draftSummary"
        (openReview)="openReviewDrawer(msg.draftSummary)"
        (downloadPdf)="downloadReportPdf(msg.draftSummary)"></app-inspection-draft-summary>

      <!-- Compact Interactive Inspection Category Chips -->
      <div *ngIf="msg.showInspectionCategories && !msg.isError" class="chat-category-chips-wrap" role="group"
        aria-label="Site inspection categories">
        <button *ngFor="let bank of siteInspectionBanks" type="button" class="chat-category-chip"
          [class.selected]="msg.selectedBankId === bank.id"
          (click)="onSelectCategoryChip(bank)">
          {{ bank.name }}
        </button>
        <button type="button" class="chat-category-chip cancel-chip" (click)="cancelCategorySelection()"
          title="Cancel category selection">
          Cancel
        </button>
      </div>

      <!-- Direct Inline Photo Upload Card -->
      <div *ngIf="msg.showInlinePhotoUpload && !msg.isError" class="chat-direct-upload-wrap">
        <input #directUploadInput type="file" multiple accept="image/*"
          (change)="onDirectPhotosSelected($event)" style="display: none" />

        <div class="direct-upload-card" (click)="directUploadInput.click()"
          (dragover)="onDirectPhotoDragOver($event)" (drop)="onDirectPhotoDrop($event)">

          <div class="direct-upload-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              class="direct-camera-svg">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
              </path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>

          <div class="direct-upload-text">
            <span class="direct-upload-title">Upload Site Photographs</span>
            <span class="direct-upload-sub">Click here or drag &amp; drop photos from your device</span>
          </div>

          <button type="button" class="btn-direct-choose"
            (click)="$event.stopPropagation(); directUploadInput.click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="choose-icon">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Choose Photos</span>
          </button>
        </div>
      </div>

      <!-- Retry action if message failed -->
      <div *ngIf="msg.isError && msg.retryPrompt" class="message-retry-row">
        <button class="btn-retry-message" (click)="retryMessage(msg.retryPrompt)" type="button"
          [disabled]="chatState.isGenerating()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="retry-icon">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
          Retry Question
        </button>
      </div>
    </div>
  </div>
</div>
